version: 1
backend:
  phases:
    build:
      commands:        
        # removing npm ci as it is too strict...
        - npm i --cache .npm --prefer-offline 
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npx ng version
    build:
      commands:
        - node scripts/generate-runtime-config.mjs
        - npx ng build --configuration=production
  artifacts:
    baseDirectory: dist/garlasco/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*

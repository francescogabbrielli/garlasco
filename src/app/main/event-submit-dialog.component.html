<div class="dialog-backdrop" (click)="closeDialog()">
  <section
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="submit-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <div class="dialog-heading">
      <div>
        <p class="eyebrow">Evento</p>
        <h1 id="submit-dialog-title">Invia un nuovo evento</h1>
      </div>

      <div class="dialog-controls">
        <button
          class="dialog-help"
          type="button"
          aria-label="Apri aiuto"
          title="Apri aiuto"
          (click)="isHelpDialogOpen.set(true)"
        >
          ?
        </button>
        <button
          class="dialog-close"
          type="button"
          aria-label="Chiudi finestra"
          title="Chiudi finestra"
          (click)="closeDialog()">
          ×
        </button>
      </div>
    </div>

    <div class="dialog-scrollable">
      @if (peopleLoadError()) {
        <p class="form-alert" role="alert">{{ peopleLoadError() }}</p>
      }
      @if (peopleLoading()) {
        <p>Caricamento persone…</p>
      } @else {
        <app-event-mask
          [people]="people()"
          [(isHelpDialogOpen)]="isHelpDialogOpen"
          (saved)="closeDialog()"></app-event-mask>
      }
    </div>
  </section>
</div>

<div class="dialog-backdrop" (click)="close.emit()">

    <section class="dialog help-dialog" role="dialog" aria-modal="true" aria-labelledby="about-title"
        (click)="$event.stopPropagation()">
        
        <header>
            <div>
                <p class="eyebrow">Guida contestuale</p>
                <h1 id="about-title">{{ title() }}</h1>
            </div>
            <div class="context-controls">
                <button 
                    class="context-button" 
                    type="button" 
                    aria-label="Chiudi" 
                    title="Chiudi" 
                    (click)="close.emit()"
                ><b>&times;</b></button>
            </div>
        </header>

        @if (isLoading()) {
        <div class="loading-inner-frame">
            <img src="assets/loading.gif" alt="Caricamento in corso..." />
        </div>
        } @else {
        <div class="scrollable">
            <div class="help-content" [innerHTML]="content()"></div>
        </div>
        }
    
    </section>
</div>

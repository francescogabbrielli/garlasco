<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Torna alla home">Garlasco</a>

  <nav class="menu" aria-label="Menu principale">
    @if (isAdminVisible) {
      <a
        class="admin-link"
        routerLink="/admin"
        routerLinkActive="active"
        aria-label="Amministrazione"
        title="Amministrazione"
      >
        ✎
      </a>
    }
    <div class="user-menu">
      <button
        class="user-label"
        type="button"
        [attr.aria-expanded]="isUserMenuOpen"
        aria-haspopup="menu"
        (click)="toggleUserMenu()"
      >
        {{ loggedUser }}
      </button>
      @if (isUserMenuOpen) {
        <div class="user-dropdown" role="menu">
          <button
            class="submit-event-button"
            type="button"
            role="menuitem"
            (click)="openSubmitDialog()"
          >
            <span aria-hidden="true">＋</span>
            Invia nuovo evento
          </button>
          <button class="logout-menuitem" type="button" role="menuitem" (click)="logout()">
            <span aria-hidden="true">⎋</span>
            Esci
          </button>
        </div>
      }
    </div>
  </nav>
</header>

<main class="page-content">
  <router-outlet />
</main>

@if (isSubmitDialogOpen) {
  <div class="dialog-backdrop" (click)="closeSubmitDialog()">
    <section
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="submit-dialog-title"
      (click)="$event.stopPropagation()"
    >
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Nuovo evento</p>
          <h2 id="submit-dialog-title">Invia un nuovo evento</h2>
        </div>
        <button
          class="dialog-close"
          amplify-button
          type="button"
          variation="link"
          aria-label="Chiudi finestra"
          title="Chiudi finestra"
          (click)="closeSubmitDialog()"
        >
          ×
        </button>
      </div>
      <div class="dialog-empty" aria-live="polite"></div>
    </section>
  </div>
}

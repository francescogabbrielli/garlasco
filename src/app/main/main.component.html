<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Torna alla home">Garlasco</a>

  <nav class="menu" aria-label="Menu principale">
      <a
        class="main-link"
        routerLink="/dashboard"
        routerLinkActive="active"
        aria-label="Dashboard"
        title="Dashboard"
      >
        ▦
      </a>
    @if (isEditor()) {
      <button
        class="main-link"
        type="button"
        [class.active]="userProfile.user().editEnabled()"
        [attr.aria-pressed]="userProfile.user().editEnabled()"
        aria-label="Modifica"
        title="Modifica"
        (click)="toggleEdit()"
      >
        ✐
      </button>
    }
    @if (isAdmin()) {
      <a
        class="main-link"
        routerLink="/admin"
        routerLinkActive="active"
        aria-label="Import"
        title="Import"
      >
        ⇪
      </a>
    }
    <div class="user-menu">
      <button
        class="user-label"
        type="button"
        [attr.aria-expanded]="isUserMenuOpen"
        aria-haspopup="menu"
        (click)="toggleUserMenu()"
      >
        {{ givenName()}} {{ familyName() }}
      </button>
      @if (isUserMenuOpen) {
        <div class="user-dropdown" role="menu">
          <button
            class="submit-event-button"
            type="button"
            role="menuitem"
            (click)="openSubmitDialog()"
          >
            <span aria-hidden="true">＋</span>
            Invia nuovo evento
          </button>
          <hr role="separator" />
          <button class="logout-menuitem" type="button" role="menuitem" (click)="logout()">
            <span aria-hidden="true">⎋</span>
            Esci
          </button>
        </div>
      }
    </div>
  </nav>
</header>

<main class="page-content">
  <router-outlet />
</main>

@if (isSubmitDialogOpen) {
  <app-event-submit-dialog
    [ownerId]="ownerId()"
    [isAdmin]="isAdmin()"
    (closed)="closeSubmitDialog()"
  ></app-event-submit-dialog>
}

<header class="topbar">
  <p class="brand" routerLink="/" aria-label="Torna alla home">I fatti di Garlasco</p>

  <nav class="menu" aria-label="Menu principale">
      <a
        class="main-link"
        routerLink="/dashboard"
        routerLinkActive="active"
        aria-label="Dashboard"
        title="Dashboard"
      >
        ▦
      </a>
    @if (isAdmin()) {
      <a
        class="main-link"
        routerLink="/admin"
        routerLinkActive="active"
        aria-label="Import"
        title="Import"
      >
        ⇪
      </a>
    }
    <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
    <button
      class="main-link"
      type="button"
      [class.active]="userProfile.user().editEnabled()"
      [attr.aria-pressed]="userProfile.user().editEnabled()"
      aria-label="Modifica"
      title="Modifica"
      (click)="toggleEdit()"
    >
      ✐
    </button>
    <div class="user-menu">
      <button
        class="user-label"
        type="button"
        [attr.aria-expanded]="isUserMenuOpen"
        aria-haspopup="menu"
        (click)="toggleUserMenu()"
      >
        {{ givenName()}} {{ familyName() }}
      </button>
      @if (isUserMenuOpen) {
        <div class="user-dropdown" role="menu">

          <hr role="separator" />
          <button id="about_button" type="button" role="menuitem" (click)="openAboutDialog()">
            <span aria-hidden="true">ℹ</span>
            Informazioni
          </button>
          <hr role="separator" />
          <button id="logout_button" type="button" role="menuitem" (click)="logout()">
            <span aria-hidden="true">⎋</span>
            Esci
          </button>
        </div>
      }
    </div>
  </nav>
</header>

<main class="page-content">
  <router-outlet />
</main>

@if (isAboutDialogOpen) {
  <div class="dialog-backdrop" (click)="closeAboutDialog()">
    <section
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="about-title"
      (click)="$event.stopPropagation()"
    >
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Informazioni</p>
          <h1 id="about-title">I Fatti di Garlasco</h1>
        </div>
        <button
          class="dialog-close"
          type="button"
          aria-label="Chiudi informazioni"
          title="Chiudi informazioni"
          (click)="closeAboutDialog()"
        >
          ×
        </button>
      </div>

      <!-- pick the version from package.json -->
      <p>versione {{ version() }} - (ultimo aggiornamento: {{ lastUpdate() }})</p>
      <small>Francesco Gabbrielli & Copilot (also known as Matteo Garlasco) &copy; 2026</small>
    
    </section>
  </div>
}

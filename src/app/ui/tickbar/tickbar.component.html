<div class="tick-bar-container" [attr.data-status]="statusColor()">
  @if (level() === 0) {
    <!-- Stato 0: Mostra la X Rossa -->
    <div class="error-x">×</div>
  } @else {
    <!-- Stato 1-4: Mostra le 4 tacche orizzontali -->
    <div class="ticks-wrapper">
      @for (tick of ticks; track tick) {
        <div class="tick" [class.active]="tick <= level()"></div>
      }
    </div>
  }
</div>

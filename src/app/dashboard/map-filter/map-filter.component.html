  @if (mapReady()) {
    <google-map
        height="500px"
        width="100%"
        [mapId]="mapId"
        [options]="computedMapOptions()"
        (mapInitialized)="onMapReady($event)"
        (boundsChanged)="onBoundsChanged()">

      @for (track of tracks(); track track.id) {
        <map-polyline [path]="track.path" [options]="trackOptions()[track.id]"></map-polyline>
      }

      @for (pin of pins(); track pin.id) {
        <map-advanced-marker
            [position]="pin.start"
            [content]="pin.startContent"
            [title]="pin.title">
        </map-advanced-marker>
        @if (pin.end) {
          <map-advanced-marker
              [position]="pin.end"
              [content]="pin.endContent"
              [title]="pin.title">
          </map-advanced-marker>
        }
      }
    </google-map>
  } @else {
    Impossibile caricare la mappa... ({{ mapError }})
  }

<main class="main-view" aria-label="Ricerca eventi">
  <header class="page-heading">
    <div>
      <p class="eyebrow">Archivio Garlasco</p>
      <h1>Esplora gli eventi</h1>
    </div>
    <p class="heading-note">Persone, tempi e luoghi in un'unica cronologia.</p>
  </header>

  <section class="mask" aria-labelledby="search-title">
    <div class="mask-heading">
      <div>
        <p class="eyebrow">Filtri</p>
      </div>
    </div>
    <div class="filter-layout">
      <div class="filter-shoulder">
        <app-person-filter
          [people]="people()"
          [loading]="peopleLoading()"
          [error]="peopleError()"
          [selectedIds]="currentFilters.peronsIds"
          (selectionChange)="handlePersonFilter($event)">
        </app-person-filter  >
      </div>
      <div class="filter-stack">
        @defer (on idle) {
          <app-range-filter 
            [initialFrom]="currentFilters.interval.from"
            [initialTo]="currentFilters.interval.to"
            [initialMin]="currentFilters.interval.min"
            [initialMax]="currentFilters.interval.max"
            [minimum]="MIN_DATE"
            [maximum]="MAX_DATE"
            (rangeChange)="handleTimeFilter($event)">
          </app-range-filter>
        } @placeholder {
          <div>Loading Timeline Slider...</div>
        }

        @defer (on idle) {
          @if (showMap) {
            <app-map-filter 
              [initialBounds]="currentFilters.bounds"
              [markers]="facts()"
              [highlightedId]="hoveredEventId()"
              (eventHover)="hoveredEventId.set($event)"
              (eventClick)="openEventById($event)"
              (mapChange)="handleMapFilter($event)">
            </app-map-filter>
          }
        } @placeholder {
          <div>Caricamento della mappa in corso...</div>
        }
      </div>
    </div>
  </section>

  <section class="event-list-section" aria-labelledby="event-list-title">
    <app-event-list 
      [items]="events()"
      [highlightedId]="hoveredEventId()"
      (eventHover)="hoveredEventId.set($event)"
      (eventClick)="openedEvent.set($event)"
      (scrolledToBottom)="onScrollBottom()">
    </app-event-list>
  </section>  

    @if (openedEvent(); as opened) {
      <app-event-popup 
        [event]="opened"
        [people]="people()"
        (saved)="triggerReload()"
        (closed)="openedEvent.set(null)"></app-event-popup>
    }

</main>

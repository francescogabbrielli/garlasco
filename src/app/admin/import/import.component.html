
    <h1>Importazione JSON</h1>

    <div class="seed-container">

        <div class="import-grid">
        <section class="import-panel" aria-labelledby="people-import-title">
            <h2 id="people-import-title">Persone</h2>
            <label for="people-json">JSON persone</label>
            <textarea id="people-json" rows="14" placeholder='[{ "name": "Mario", "surname": "Rossi", "initials": "MR" }]' [ngModel]="peopleJsonInput()"
                (ngModelChange)="peopleJsonInput.set($event)" class="custom-textarea"></textarea>
            <div class="actions-panel">
                <button type="button" 
                    class="btn action-button" 
                    [disabled]="isWorking()" 
                    (click)="importaPersoneDaTextarea()">
                    {{ isWorking() ? 'Caricamento...' : 'Importa persone' }}
                </button>
                <button type="button"
                    class="btn secondary-button"  
                    [disabled]="isWorking()" 
                    (click)="cleanPeopleInput()">
                    Azzera
                </button>
            </div>
            <p class="import-note">I campi relazione, come <code>events</code>, vengono ignorati. Gli ID forniti vengono mantenuti.</p>
        </section>

        <section class="import-panel" aria-labelledby="events-import-title">
            <h2 id="events-import-title">Eventi</h2>
            <label for="events-json">JSON eventi</label>
            <textarea id="events-json" rows="14" placeholder='[{ "name": "Evento", ... }]' [ngModel]="jsonInput()"
                (ngModelChange)="jsonInput.set($event)" class="custom-textarea"></textarea>
            <div class="actions-panel">
                <button type="button" 
                    class="btn action-button" 
                    [disabled]="isWorking()" 
                    (click)="eseguiUploadDaTextarea()">
                    {{ isWorking() ? 'Caricamento...' : 'Importa eventi' }}
                </button>
                <button type="button" 
                    class="btn secondary-button" 
                    [disabled]="isWorking()" 
                    (click)="cleanInputData()">
                    Azzera
                </button>
            </div>
            <p class="import-note">Per associare persone già importate, indica <code>"actors": [&#123; "personId": "...", "role": "..." &#125;]</code>.</p>      
        </section>
        </div>
    </div>

    <app-splash-dialog #importSplash defaultMessage="Importazione"></app-splash-dialog>

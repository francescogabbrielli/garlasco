<article
  class="hypothesis-card"
  [class.selected]="selected()"
  role="button"
  tabindex="0"
  (click)="click.emit()"
  (keydown.enter)="click.emit()"
  (keydown.space)="$event.preventDefault(); click.emit()">

  <h3 class="card-title">{{ hypothesis().name }}</h3>

  <pre class="card-description">{{ hypothesis().description }}</pre>

  <div class="card-meta">
    @if (hypothesis().updatedAt; as d) {
      <time [attr.datetime]="d">{{ d | date: 'dd MMM yyyy' }}</time>
    }
  </div>

  <div class="card-actors">
      @for (actor of actors(); track actor.id) {
        <span class="badge">{{ actor.name }} {{ actor.surname}}</span>
      }
  </div>
</article>

<amplify-authenticator
  [signUpAttributes]="signUpAttributes"
  [formFields]="formFields"
>
  <ng-template
    amplifySlot="authenticated"
    let-user="user"
    let-signOut="signOut"
  >
    <h1>Welcome, {{ userAttributes['given_name'] ?? '...' }}!</h1>
    <button (click)="signOut()">Sign Out</button>
  </ng-template>
</amplify-authenticator>
